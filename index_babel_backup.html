        // ─── DRAWING HELPERS ───
        function drawPlayer(ctx, x, y) {
            ctx.fillStyle = "#e53935"; ctx.fillRect(x, y + 10, PLAYER_W, PLAYER_H - 10);
            ctx.fillStyle = "#ffccbc"; ctx.beginPath(); ctx.arc(x + PLAYER_W / 2, y + 12, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.fillRect(x + 8, y + 8, 7, 6); ctx.fillRect(x + 25, y + 8, 7, 6);
            ctx.fillStyle = "#000"; ctx.fillRect(x + 11, y + 10, 3, 3); ctx.fillRect(x + 28, y + 10, 3, 3);
            ctx.fillStyle = "#c62828"; ctx.fillRect(x - 5, y + 12, 8, 22); ctx.fillRect(x + PLAYER_W - 3, y + 12, 8, 22);
        }
        function drawBullet(ctx, x, y) { ctx.fillStyle = "#ffeb3b"; ctx.shadowBlur=6; ctx.shadowColor="#ffeb3b"; ctx.fillRect(x, y, BULLET_W, BULLET_H); ctx.shadowBlur=0; }
        function drawHeart(ctx, x, y, alive) {
            ctx.fillStyle = alive ? "#e53935" : "#555"; ctx.beginPath(); ctx.moveTo(x + 10, y + 6);
            ctx.bezierCurveTo(x + 10, y, x, y, x, y + 6); ctx.bezierCurveTo(x, y + 12, x + 10, y + 18, x + 10, y + 20);
            ctx.bezierCurveTo(x + 10, y + 18, x + 20, y + 12, x + 20, y + 6); ctx.bezierCurveTo(x + 20, y, x + 10, y, x + 10, y + 6); ctx.fill();
        }

        // ─── BOSS DRAWING ───
        function drawPeachColossus(ctx, x, y) {
            const b = Math.sin(Date.now()/300)*3;
            ctx.fillStyle="#ff7043"; ctx.beginPath(); ctx.ellipse(x+60, y+55+b, 55, 50, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle="#ef5350"; ctx.beginPath(); ctx.ellipse(x+60, y+55+b, 40, 35, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle="#66bb6a"; ctx.fillRect(x+52, y-5+b, 16, 20);
            ctx.fillStyle="#fff"; ctx.fillRect(x+35, y+40+b, 16, 14); ctx.fillRect(x+69, y+40+b, 16, 14);
            ctx.fillStyle="#000"; ctx.fillRect(x+42, y+43+b, 6, 6); ctx.fillRect(x+76, y+43+b, 6, 6); ctx.fillRect(x+42, y+60+b, 36, 4);
        }
        function drawHotDogHydra(ctx, x, y) {
            const b = Math.sin(Date.now()/250)*3;

            for(let i=0;i<3;i++){
                ctx.fillStyle=clr[i]; ctx.beginPath(); ctx.ellipse(x+25+i*25, y+32+b, 12, 7, 0, 0, Math.PI*2); ctx.fill();

            ctx.beginPath(); ctx.ellipse(x+125, y+50+b, 22, 14, 0.3, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x+37, y+18+b, 5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+73, y+18+b, 5, 0, Math.PI*2); ctx.fill();

        }
        function drawPancakeStack(ctx, x, y) {
            const b = Math.sin(Date.now()/320)*3;
            const clr = ["#d7a94e", "#c8953d", "#dbb55a", "#bf8a30", "#e0c06a"];
            for(let i=4;i>=0;i--) { ctx.fillStyle=clr[i]; ctx.beginPath(); ctx.ellipse(x+55, y+80-i*18+b, 48-i*2, 10, 0, 0, Math.PI*2); ctx.fill(); }
            ctx.fillStyle="#8d6e00"; ctx.fillRect(x+20, y+80+b, 5, 18); ctx.fillRect(x+75, y+75+b, 4, 22);
            ctx.fillStyle="#ffee58"; ctx.fillRect(x+40, y-2+b, 30, 14);
            ctx.fillStyle="#fff"; ctx.fillRect(x+30, y+8+b, 12, 10); ctx.fillRect(x+68, y+8+b, 12, 10);
            ctx.fillStyle="#000"; ctx.fillRect(x+34, y+11+b, 5, 5); ctx.fillRect(x+72, y+11+b, 5, 5);
        }
        function drawSouvlakiCyclops(ctx, x, y) {
            const b = Math.sin(Date.now()/270)*3;
            ctx.fillStyle="#8d6e63"; ctx.beginPath(); ctx.ellipse(x+55, y+60+b, 48, 45, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle="#d32f2f"; [{px:25,py:45},{px:60,py:55},{px:80,py:40},{px:45,py:70}].forEach(m=>{ctx.beginPath();ctx.ellipse(x+m.px,y+m.py+b,8,5,0.5,0,Math.PI*2);ctx.fill();});
            ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x+55, y+42+b, 18, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle="#1a237e"; ctx.beginPath(); ctx.arc(x+55, y+42+b, 10, 0, Math.PI*2); ctx.fill();

        }
        function drawKoshariPharaoh(ctx, x, y) {
            const b = Math.sin(Date.now()/300)*3;
            ctx.fillStyle="#fff8e1"; ctx.fillRect(x+15, y+30+b, 80, 80);
            ctx.strokeStyle="#ffe082"; ctx.lineWidth=2; for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x+15,y+45+i*14+b);ctx.lineTo(x+95,y+45+i*14+b);ctx.stroke();}
            ctx.fillStyle="#ffd600"; ctx.beginPath(); ctx.moveTo(x+30,y+30+b); ctx.lineTo(x+25,y-20+b); ctx.lineTo(x+45,y+15+b); ctx.lineTo(x+55,y-30+b); ctx.lineTo(x+65,y+15+b); ctx.lineTo(x+85,y-20+b); ctx.lineTo(x+80,y+30+b); ctx.fill();
            ctx.fillStyle="#ffcc00"; ctx.beginPath(); ctx.ellipse(x+40,y+42+b,7,5,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x+70,y+42+b,7,5,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle="#000"; ctx.fillRect(x+38,y+40+b,4,4); ctx.fillRect(x+68,y+40+b,4,4);
        }

        const BOSS_DRAWERS = { atlanta: drawPeachColossus, nyc: drawHotDogHydra, boston: drawLobsterLord, tennessee: drawPancakeStack, athens: drawSouvlakiCyclops, egypt: drawKoshariPharaoh };

        // ─── BACKGROUNDS ───

            [[50,180,60,220],[130,140,50,260],[210,200,70,200],[320,120,55,280],[410,170,65,230],[510,100,50,300],[600,160,70,240],[700,130,60,270]].forEach(([x,y,w,h])=>{ ctx.fillStyle="#4e342e";ctx.fillRect(x,y,w,h); ctx.fillStyle="#ffcc80"; for(let wy=y+10;wy<y+h-10;wy+=18) for(let wx=x+8;wx<x+w-8;wx+=16) if(Math.random()>0.4) ctx.fillRect(wx,wy,8,10); });

            const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#1a237e"); g.addColorStop(1,"#3949ab"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
            [[20,60,45,340],[80,30,55,370],[160,80,40,320],[230,20,60,380],[320,70,50,330],[400,10,45,390],[480,50,55,350],[570,40,50,360],[650,70,60,330],[740,30,55,370]].forEach(([x,y,w,h])=>{ ctx.fillStyle="#283593";ctx.fillRect(x,y,w,h); ctx.fillStyle="#ffeb3b"; for(let wy=y+8;wy<y+h-8;wy+=14) for(let wx=x+5;wx<x+w-5;wx+=12) if(Math.random()>0.3) ctx.fillRect(wx,wy,6,8); });
            ctx.fillStyle="#ffee58"; ctx.fillRect(W-100,H-80,70,30); ctx.fillStyle="#000"; ctx.fillRect(W-95,H-75,25,15); ctx.fillRect(W-55,H-75,20,15); ctx.fillStyle="#37474f"; ctx.fillRect(0,H-60,W,60);
        }
        function drawBostonBg(ctx) {
            const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0d47a1"); g.addColorStop(1,"#1976d2"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
            ctx.fillStyle="#1565c0"; ctx.fillRect(0,H-120,W,120);
            [[30,200,70,200],[120,180,55,220],[200,210,80,190],[320,170,60,230],[420,195,75,205],[540,180,65,220],[640,200,80,200]].forEach(([x,y,w,h])=>{ ctx.fillStyle="#5d4037";ctx.fillRect(x,y,w,h); ctx.fillStyle="#80deea"; for(let wy=y+12;wy<y+h-12;wy+=20) for(let wx=x+10;wx<x+w-10;wx+=18) ctx.fillRect(wx,wy,8,10); }); ctx.fillStyle="#3e2723"; ctx.fillRect(0,H-60,W,60);
        }
        function drawTennesseeBg(ctx) {
            const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#66bb6a"); g.addColorStop(0.5,"#81c784"); g.addColorStop(1,"#a5d6a7"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
            [[{x:-50,y:H-100},{x:200,y:80},{x:450,y:H-100}],[{x:100,y:H-80},{x:350,y:120},{x:600,y:H-80}],[{x:350,y:H-90},{x:550,y:60},{x:850,y:H-90}]].forEach((pts,i)=>{ ctx.fillStyle=i===0?"#2e7d32":i===1?"#388e3c":"#43a047"; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); ctx.lineTo(pts[1].x,pts[1].y); ctx.lineTo(pts[2].x,pts[2].y); ctx.fill(); });

        function drawAthensBg(ctx, scrollX) {
            const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#e3f2fd"); g.addColorStop(1,"#bbdefb"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
            const cx = 180 - scrollX*0.3; ctx.fillStyle="#efebe9"; ctx.fillRect(cx-30,H-160,260,20); ctx.fillRect(cx-20,H-180,240,25); ctx.fillRect(cx-25,H-240,250,20);
            for(let i=0;i<6;i++){ctx.fillStyle="#fafafa"; ctx.fillRect(cx+i*40,H-240,22,65);}
            ctx.fillStyle="#81c784"; ctx.beginPath(); ctx.ellipse(650-scrollX*0.5,H-60,180,80,0,Math.PI,0); ctx.fill();
            ctx.fillStyle="#d7ccc8"; ctx.fillRect(0,H-80,W,80);

        function drawEgyptBg(ctx) {

            ctx.fillStyle="#fff9c4"; ctx.shadowBlur=30; ctx.shadowColor="#ffee58"; ctx.beginPath(); ctx.arc(650,80,50,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            [[{x:50,y:H-60},{x:200,y:80},{x:350,y:H-60}],[{x:300,y:H-60},{x:420,y:140},{x:540,y:H-60}],[{x:520,y:H-60},{x:620,y:180},{x:720,y:H-60}]].forEach((pts,i)=>{ctx.fillStyle=i===0?"#f57c00":i===1?"#ef6c00":"#e65100";ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[1].x,pts[1].y);ctx.lineTo(pts[2].x,pts[2].y);ctx.fill();});

        // ─── ATTACKS ───
        function getAttacks(level, phase, bossX, bossY) {
            const attacks = []; const time = Date.now();
            if(level==="atlanta"){
                if(phase===0){ const c=Math.floor(time/2500)%2; const ry=(time%2500)/2500*(H+100)-100; if(c===0) attacks.push({x:0,y:ry,vx:0,vy:5,w:W/2,h:80,type:"fallingrod"}); else { attacks.push({x:0,y:ry,vx:0,vy:5,w:120,h:80,type:"fallingrod"}); attacks.push({x:220,y:ry,vx:0,vy:5,w:120,h:80,type:"fallingrod"}); attacks.push({x:440,y:ry,vx:0,vy:5,w:120,h:80,type:"fallingrod"}); } }
                else if(phase===1){ if(time%1200<50) attacks.push({x:-20,y:H-100,vx:4,vy:0,w:14,h:14,type:"pit"}); if(time%1400<50) attacks.push({x:W+20,y:H-200,vx:-4,vy:0,w:14,h:14,type:"pit"}); if(time%1600<50) attacks.push({x:-20,y:H-300,vx:4,vy:0,w:14,h:14,type:"pit"}); }
                else { if(time%950<50) for(let i=-1.5;i<=1.5;i++) attacks.push({x:bossX+60,y:bossY+60,vx:i,vy:1.5+Math.abs(i)*0.15,w:10,h:10,type:"juice"}); }
            } else if(level==="nyc"){

                    if(level==="boston"){const m=BOSTON_MAZES[gs.bossPhase];ctx.strokeStyle="#2196f3";ctx.lineWidth=3;for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]==='#')ctx.strokeRect(c*CELL,r*CELL,CELL,CELL); ctx.fillStyle="#fff";gs.clams.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,3,0,Math.PI*2);ctx.fill();}); gs.crabs.forEach(c=>{ctx.fillStyle="#ef5350";ctx.beginPath();ctx.arc(c.x,c.y,10,0,Math.PI*2);ctx.fill();});}
                    else if(level==="tennessee"){TN_PLATFORMS.forEach(p=>{ctx.fillStyle="#8B4513";ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle="#A0522D";ctx.fillRect(p.x,p.y,p.w,5);}); gs.enemies.forEach(e=>{ctx.fillStyle="#d7a94e";ctx.beginPath();ctx.ellipse(e.x+15,e.y+15,15,10,0,0,Math.PI*2);ctx.fill();});}
                    else if(level==="athens"){const cx=gs.wallX-gs.scrollX+40;const bg=ctx.createLinearGradient(0,120,0,H);bg.addColorStop(0,"rgba(255,0,0,0.8)");bg.addColorStop(1,"rgba(255,0,0,0.3)");ctx.fillStyle=bg;ctx.fillRect(cx-20,120,100,H); gs.obstacles.forEach(o=>{const sx=o.x-gs.scrollX;if(sx>-100&&sx<W+100){if(o.type==="spike"){ctx.fillStyle="#e53935";ctx.beginPath();ctx.moveTo(sx,o.y+o.h);ctx.lineTo(sx+o.w/2,o.y);ctx.lineTo(sx+o.w,o.y+o.h);ctx.fill();}else if(o.type==="block"){ctx.fillStyle="#5d4037";ctx.fillRect(sx,o.y,o.w,o.h);}else{ctx.fillStyle="#757575";ctx.beginPath();ctx.arc(sx+o.w/2,o.y+o.h/2,o.w/2,0,Math.PI*2);ctx.fill();}}});const dx=gs.doorX-gs.scrollX;if(dx>-100&&dx<W+100){ctx.fillStyle="#4caf50";ctx.fillRect(dx,H-140,60,60);}}
                    else if(level==="egypt"){ctx.fillStyle="#8d6e63";ctx.fillRect(EGYPT_PLATFORM.x,EGYPT_PLATFORM.y,EGYPT_PLATFORM.w,EGYPT_PLATFORM.h);gs.tentacles.forEach(t=>{ctx.fillStyle="#8d6e63";ctx.fillRect(t.x,t.y,t.w,t.h);});gs.fallingObjects.forEach(f=>{ctx.fillStyle="#bf360c";ctx.beginPath();ctx.arc(f.x+15,f.y+15,15,0,Math.PI*2);ctx.fill();});}
                    
                    if(type!=="runner" && type!=="maze"){BOSS_DRAWERS[level](ctx,gs.bossX,gs.bossY);if(gs.bossFlash>0){ctx.fillStyle="rgba(255,255,255,0.3)";ctx.fillRect(gs.bossX-10,gs.bossY-10,140,140);}}
                    else if(type==="runner")BOSS_DRAWERS[level](ctx,gs.wallX-gs.scrollX+40,100);

                    if(gs.invincible<=0||Math.floor(gs.invincible)%3<2){
                        if(level==="boston"){ctx.fillStyle="#9c27b0";ctx.beginPath();ctx.arc(gs.playerX+10,gs.playerY+10,10,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffeb3b";ctx.fillRect(gs.playerX+5,gs.playerY+7,4,4);ctx.fillRect(gs.playerX+11,gs.playerY+7,4,4);}
                        else if(level==="athens")drawPlayer(ctx,gs.playerX-gs.scrollX,gs.playerY);
                        else drawPlayer(ctx,gs.playerX,gs.playerY);
                    }
                    gs.bullets.forEach(b=>drawBullet(ctx,b.x,b.y));
                    gs.attacks.forEach(a=>{if(a.type==="fallingrod"){ctx.fillStyle="#ff1744";ctx.fillRect(a.x,a.y,a.w,a.h);}else if(a.type==="pit"){ctx.fillStyle="#00e5ff";ctx.beginPath();ctx.arc(a.x+7,a.y+7,7,0,Math.PI*2);ctx.fill();}else if(a.type==="syrup"){ctx.fillStyle="#8d6e00";ctx.fillRect(a.x,a.y,8,20);}else{ctx.fillStyle="#ff4081";ctx.fillRect(a.x,a.y,a.w,a.h);}});
                    if(level==="nyc"&&gs.bottles)gs.bottles.forEach(b=>{ctx.fillStyle=b.l==="K"?"#d32f2f":"#ffeb3b";ctx.fillRect(b.x,b.y+10,40,40);});

                    for(let i=0;i<3;i++)drawHeart(ctx,15+i*28,12,i<gs.hearts);
                    if(level==="boston"){ctx.fillStyle="#fff";ctx.font="bold 14px monospace";ctx.fillText(`Clams: ${gs.clams.length}`,W-120,30);}
                    else if(level!=="athens"){const tot=level==="egypt"?4:3;ctx.fillStyle="#333";ctx.fillRect(W-200,12,180,22);for(let i=0;i<gs.bossHP;i++){const w=176/tot;const cur=i===gs.bossHP-1;ctx.fillStyle=cur?(gs.damageBar>0.6?"#ff9800":"#4caf50"):"#2e7d32";ctx.fillRect(W-198+i*w,14,cur?w*gs.damageBar:w-1,18);}}

                    animRef.current = requestAnimationFrame(loop);
                };
                animRef.current = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(animRef.current);
            }, [screen, currentLevel, vocabIndex, initGameState]);

            const handleVocabAnswer = (chosen) => {
                clearInterval(vocabTimerRef.current);
                const gs=gameState.current; const level=LEVELS[currentLevel];
                if(chosen===currentVocab.correct){
                    if(level==="athens"){if(gs.bossPhase>=2){setScreen("victory");return;}gs.bossPhase++;gs.damageBar=0;gs.wallX=gs.playerX-600;}
                    else{gs.bossHP--;if(gs.hearts<3)gs.hearts++;if(gs.bossHP<=0){setScreen("victory");return;}gs.bossPhase++;gs.damageBar=0;}
                    setVocabIndex(vocabIndex+1);setScreen("playing");
                } else {setWrongAnswer(true);setTimeout(()=>{setWrongAnswer(false);setScreen("playing");},1200);}
            };
            vocabHandlerRef.current = (screen==="vocab"&&currentVocab&&!wrongAnswer)?(idx)=>{if(idx<currentVocab.options.length)handleVocabAnswer(currentVocab.options[idx]);}:null;

            if(screen==="title")return(<div style={{width:W,height:H,background:"#16213e",color:"#fff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><h1 style={{fontSize:40,color:"#e91e63"}}>FEAST & FLIGHT</h1><button onClick={()=>{initGameState();setScreen("playing")}} style={{padding:"10px 20px",marginTop:20,fontSize:20,cursor:"pointer"}}>START GAME</button></div>);
            if(screen==="gameover")return(<div style={{width:W,height:H,background:"#300",color:"#fff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><h1>DEFEATED</h1><button onClick={()=>{setVocabIndex(0);gameState.current=null;setScreen("playing")}} style={{padding:"10px 20px",marginTop:20,cursor:"pointer"}}>TRY AGAIN</button></div>);
            if(screen==="vocab")return(<div style={{width:W,height:H,background:"#222",color:"#fff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>{wrongAnswer&&<div style={{position:"absolute",fontSize:50,color:"red"}}>WRONG</div>}<h2>{currentVocab?.word}</h2>{currentVocab?.options.map((o,i)=><div key={i} onClick={()=>handleVocabAnswer(o)} style={{padding:10,border:"1px solid #555",margin:5,cursor:"pointer",width:400}}>{i+1}. {o}</div>)}</div>);
            if(screen==="victory"){
                const isFinal = currentLevel===LEVELS.length-1;
                return(<div style={{width:W,height:H,background:"#4a148c",color:"#fff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:40,textAlign:"center"}}><h1>{isFinal?"You Did It! 💝":"Level Complete!"}</h1><p style={{whiteSpace:"pre-line",fontSize:18}}>{isFinal?FINAL_MESSAGE:MEMORIES[LEVELS[currentLevel]]}</p><button onClick={()=>{if(isFinal)window.location.reload();else{setCurrentLevel(c=>c+1);setVocabIndex(0);gameState.current=null;setScreen("playing");}}} style={{marginTop:20,padding:"10px 20px",fontSize:18,cursor:"pointer"}}>{isFinal?"Play Again":"Next Level →"}</button></div>);
            }
            return(<div style={{position:"relative",width:W,height:H}}><canvas ref={canvasRef} width={W} height={H} style={{background:"#000"}}/><div style={{position:"absolute",top:10,left:10,color:"#fff"}}>{LEVEL_NAMES[LEVELS[currentLevel]]}</div>{screen==="playing"&&<div onClick={()=>{if(currentLevel===LEVELS.length-1)setScreen("victory");else{setCurrentLevel(c=>c+1);setVocabIndex(0);gameState.current=null;setScreen("playing");}}} style={{position:"absolute",bottom:10,right:10,color:"#fff",cursor:"pointer",border:"1px solid #fff",padding:5,fontSize:10}}>SKIP LEVEL</div>}</div>);
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ValentineGame />);
    </script>
</body>
</html>
